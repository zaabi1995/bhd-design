<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<defs>
<filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n"/>
  <feColorMatrix in="n" type="matrix"
     values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.16 0"/>
</filter>
<filter id="lpDark" x="-30%" y="-30%" width="160%" height="160%"
        color-interpolation-filters="sRGB">
  <feOffset in="SourceAlpha" dx="0" dy="6" result="o"/>
  <feGaussianBlur in="o" stdDeviation="3.2" result="b"/>
  <feColorMatrix in="b" type="matrix"
     values="0 0 0 0 0.1647  0 0 0 0 0.1294  0 0 0 0 0.0627  0 0 0 -0.62 0.62"
     result="inv"/>
  <feComposite in="inv" in2="SourceAlpha" operator="in"/>
</filter>
<filter id="lpLite" x="-30%" y="-30%" width="160%" height="160%"
        color-interpolation-filters="sRGB">
