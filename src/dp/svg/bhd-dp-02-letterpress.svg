  <feColorMatrix in="b" type="matrix"
     values="0 0 0 0 1.0000  0 0 0 0 0.9922  0 0 0 0 0.9569  0 0 0 -0.42 0.42"
     result="inv"/>
  <feComposite in="inv" in2="SourceAlpha" operator="in"/>
</filter>
<filter id="lpLip" x="-30%" y="-30%" width="160%" height="160%"
        color-interpolation-filters="sRGB">
  <feOffset in="SourceAlpha" dx="0" dy="5" result="o"/>
  <feGaussianBlur in="o" stdDeviation="5.0" result="b"/>
  <feColorMatrix in="b" type="matrix"
     values="0 0 0 0 0.3686  0 0 0 0 0.3020  0 0 0 0 0.1804  0 0 0 0.44 0"
     result="tint"/>
  <feComposite in="tint" in2="SourceAlpha" operator="out"/>
</filter></defs>
